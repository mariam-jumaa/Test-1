<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students CRUD App</title>
</head>
<body>
    <h1>Students CRUD App</h1>
    <p>Add a student, then manage records below.</p>
    <!-- Add Student Section -->
    <h2>Add New Student</h2>
    <label>Name:</label><br>
    <input type="text" id="name"><br><br>
    <label>Email:</label><br>
    <input type="email" id="email"><br><br>
    <label>Course:</label><br>
    <input type="text" id="course"><br><br>
    <button onclick="addStudent()">Add Student</button>
    <!-- Message Section -->
    <h2>Message</h2>
    <p id="message">No action yet.</p>
    <!-- Students List -->
    <h2>Students List</h2>
    <div id="studentsList"></div>
    <!-- Update Popup -->
    <div id="updateBox" style="display:none; border:1px solid black; padding:15px; margin-top:20px;">
        <h2>Update Student</h2>
        <input type="hidden" id="updateID">
        <label>Name:</label><br>
        <input type="text" id="updateName"><br><br>
        <label>Email:</label><br>
        <input type="email" id="updateEmail"><br><br>
        <label>Course:</label><br>
        <input type="text" id="updateCourse"><br><br>
        <button onclick="saveUpdate()">Save</button>
        <button onclick="closeUpdateBox()">Cancel</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
